<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>My Calendar</title>
    <style>
        body {
            font-family: sans-serif;
            background: #111;
            color: #eee;
            padding: 2rem;
        }
    </style>
</head>
<body>

<h1>Today</h1>
<ul id="events"></ul>

<script>
    fetch('/api/today')
        .then(res => res.json())
        .then(data => {
            const ul = document.getElementById('events');
            data.events.forEach(e => {
                const li = document.createElement('li');
                li.textContent = `${e.time} — ${e.title}`;
                ul.appendChild(li);
            });
        })
        .catch(err => console.error(err));
</script>

</body>
</html>
